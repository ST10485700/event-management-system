name: Validate Docs Folder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check ERD file exists (PNG or PDF)
        run: |
          if ! ls docs/*ERD* 1> /dev/null 2>&1; then
            echo "ERROR: No ERD file found in /docs (expected a filename containing 'ERD', .png or .pdf)."
            exit 1
          fi
          echo "ERD file found."

      - name: Check API endpoint plan exists (PDF or Markdown)
        run: |
          if ! ls docs/*Endpoint* 1> /dev/null 2>&1; then
            echo "ERROR: No API endpoint plan found in /docs (expected a filename containing 'Endpoint', .pdf or .md)."
            exit 1
          fi
          echo "API endpoint plan found."

      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: No .sql file found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: All required files present
        run: echo "Docs folder structure is valid."
